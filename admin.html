<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vehicle QR Generator</title>

<link rel="stylesheet" href="admin.css">

</head>

<body>

<div class="container">

    <h1>🚗 Vehicle QR Generator</h1>

    <p class="subtitle">
        Create QR Codes For Unlimited Vehicles
    </p>

    <div class="card">

        <label>👤 Owner Name</label>

        <input
        type="text"
        id="owner"
        placeholder="Enter Owner Name">

        <label>🚘 Vehicle Name</label>

        <input
        type="text"
        id="car"
        placeholder="Enter Car Name">

        <label>🚗 Vehicle Number</label>

        <input
        type="text"
        id="number"
        placeholder="Enter Vehicle Number">

<label>📱 Owner Mobile Number</label>

<input
type="tel"
id="mobile"
placeholder="Enter Mobile Number">

<label>📸 Vehicle Photo URL</label>

<input
type="url"
id="photo"
placeholder="Paste Vehicle Photo URL">

<label for="vehicleType">Vehicle Type</label>

<select id="vehicleType">

    <option value="car">🚘 Car / SUV</option>

    <option value="bike">🏍️ Bike / Scooter</option>

</select>
        <button onclick="generateQR()">

            🚀 Generate QR

        </button>

    </div>

    <div
    id="result"
    class="result">

    </div>

</div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script src="admin.js"></script>

</body>

</html>
