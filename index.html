<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vehicle Alert System</title>
  <link rel="stylesheet" href="style.css">
</head>
  
<body>

  <div class="box">
  <h2>Vehicle Alert System</h2>

  <p id="vehicleText"></p>

  <select id="issueSelect" onchange="enableButton()" style="width:100%;padding:10px;margin:10px 0;">
    <option value="">Select Issue</option>
    <option value="No Parking">No Parking</option>
    <option value="Move Vehicle">Move Vehicle</option>
    <option value="Lights On">Lights On</option>
  </select>

  <button id="sendBtn" onclick="sendAlert()" disabled
    style="width:100%;padding:12px;background:gray;color:white;border:none;border-radius:8px;">
    Send Notification
  </button>
</div>
 <script src="script.js"></script>
</body>
</html>
