<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vehicle Alert System</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>🚗 Vehicle Alert</h1>

    <p class="subtitle">
        Scan • Select Issue • Notify Owner
    </p>

    <!-- Vehicle Card -->

    <div class="vehicle-card">

        <div id="vehicleIcon" class="car-icon">
            🚘
        </div>

        <h2 id="carName">
            Loading...
        </h2>

        <p class="owner">

            👤
            <span id="ownerName">
                Loading...
            </span>

        </p>

        <!-- Number Plate -->

        <div class="number-plate">

            <div class="plate-left">
                IND
            </div>

            <div class="plate-right">

                <span id="plateNumber">
                    Loading...
                </span>

            </div>

        </div>

    </div>
    <!-- Issue Buttons -->

    <button class="opt"
    onclick="selectIssue(this,'No Parking Zone')">
        🚫 No Parking Zone
    </button>

    <button class="opt"
    onclick="selectIssue(this,'Please Move Vehicle')">
        🚗 Please Move Vehicle
    </button>

    <button class="opt"
    onclick="selectIssue(this,'Headlights On')">
        💡 Headlights On
    </button>

    <button class="opt"
    onclick="selectIssue(this,'Vehicle Damaged')">
        🔧 Vehicle Damaged
    </button>

    <button class="opt"
    onclick="selectIssue(this,'Security Issue')">
        🛡️ Security Issue
    </button>

    <button class="opt"
    onclick="selectIssue(this,'Other Issue')">
        ❓ Other Issue
    </button>

<textarea
id="otherIssue"
placeholder="Describe your issue..."
style="
display:none;
width:100%;
height:90px;
margin-top:10px;
padding:12px;
border-radius:12px;
border:2px solid #dbeafe;
font-size:15px;
resize:none;
outline:none;">
</textarea>

    <!-- Send Button -->

    <button
    id="sendBtn"
    onclick="sendAlert()"
    disabled>

        🚨 Send Alert

    </button>
<button
style="margin-top:10px;background:#16a34a;color:#fff;"
onclick="sendSMSTest()">

💬 Test SMS

</button>

</div>

<!-- =========================
     Success Popup
========================== -->

<div id="success">

    <div class="success-card">

        <h2>✅ Alert Sent Successfully</h2>

        <p>
            Vehicle Owner has been notified successfully.
        </p>

    </div>

</div>

<!-- =========================
     Confirmation Popup
========================== -->

<div id="confirmPopup">

    <div class="confirm-card">

        <h2>⚠️ Confirm Alert</h2>

        <p>
            Are you sure you want to notify the vehicle owner?
        </p>

        <div class="confirm-buttons">

            <button
            id="cancelBtn"
            onclick="closeConfirm()">

                Cancel

            </button>

            <button
            id="confirmBtn"
            onclick="confirmSend()">

                Send Alert

            </button>

        </div>

    </div>

</div>
<!-- Load Script -->

<script src="script.js"></script>

</body>
</html>
