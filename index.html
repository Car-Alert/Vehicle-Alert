<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vehicle Alert System</title>
  <link rel="stylesheet" href="style.css">
</head>
  
<body>

  <div class="box">
  <h2>Vehicle Alert System</h2>

  <p id="vehicleText"></p>

 <div id="options">

    <button class="opt" onclick="selectIssue(this,'No Parking')">No Parking</button>
    <button class="opt" onclick="selectIssue(this,'Move Vehicle')">Move Vehicle</button>
    <button class="opt" onclick="selectIssue(this,'Lights On')">Lights On</button>

  </div>

  <button id="sendBtn" onclick="sendAlert()" disabled
    style="width:100%;padding:12px;background:gray;color:white;border:none;border-radius:8px;">
    Send Notification
  </button>
</div>
 <script src="script.js"></script>
</body>
</html>
