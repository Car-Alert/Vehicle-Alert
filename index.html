<!DOCTYPE html>
<html>
<head>
  <title>Vehicle Alert System</title>

  <style>
    body {
      font-family: Arial;
      background: #f2f2f2;
      text-align: center;
      padding: 20px;
    }

    .box {
      background:#87CEEB ;
      padding: 20px;
      border-radius: 12px;
      width: 600px;
      margin: auto;
      box-shadow: 0px 0px 10px #ccc;
    }

    .opt {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      transition: 0.2s;
    }

    .opt.active {
      background: #4caf50;
      color: white;
      border: none;
    }

    #sendBtn {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: gray;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: not-allowed;
      font-size: 16px;
    }

    #sendBtn.active {
      background: #ff3b3b;
      cursor: pointer;
    }

    /* SUCCESS SCREEN */
    #success {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      color: white;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-size: 30px;
    }

    #success small {
      font-size: 16px;
      margin-top: 10px;
    }

  </style>
</head>

<body>


<div class="box">
  <h2>Vehicle Alert System</h2>

  <p id="vehicleText"></p>

  <button class="opt" onclick="selectIssue(this,'No Parking Zone')">No Parking Zone</button>
  <button class="opt" onclick="selectIssue(this,'Please Move Vehicle')">Please Move Vehicle</button>
  <button class="opt" onclick="selectIssue(this,'Headlights On')">Headlights On</button>
  <button class="opt" onclick="selectIssue(this,'Vehicle Damaged')">Vehicle Damaged</button>
  <button class="opt" onclick="selectIssue(this,'Security Issue')">Security Issue</button>
  <button class="opt" onclick="selectIssue(this,'Other Issue')">Other Issue</button>

  <button id="sendBtn" onclick="sendAlert()" disabled>
    Send Notification
  </button>
</div>

<!-- SUCCESS SCREEN -->
<div id="success">
  🚨 MESSAGE SENT SUCCESSFULLY
  <small>Redirecting...</small>
</div>

<script src="script.js">
</script>
</body>
</html>
