<?xml version="1.0" encoding="UTF-8"?>

<svg
xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 64 64">

<defs>

<linearGradient id="redGrad"
x1="0%"
y1="0%"
x2="100%"
y2="100%">

<stop offset="0%" stop-color="#ff6b6b"/>

<stop offset="100%" stop-color="#ef4444"/>

</linearGradient>

<filter id="shadow"
x="-50%"
y="-50%"
