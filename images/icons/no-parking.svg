<circle
cx="32"
cy="32"
r="20"
fill="#ffffff"/>

<text
x="32"
y="40"
text-anchor="middle"
font-family="Arial"
font-size="24"
font-weight="700"
fill="#ef4444">

P

</text>

<line
x1="16"
y1="48"
x2="48"
y2="16"
stroke="#ef4444"
stroke-width="5"
stroke-linecap="round"/>

</svg>